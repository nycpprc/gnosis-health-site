{% macro card(p, filterable=False) %}
<article class="card"{% if filterable %} data-slug="{{ p.slug }}" data-year="{{ p.year }}" data-tags="{{ p.tags|join('|') }}" data-text="{{ p.title|lower }}"{% endif %}>
  <a class="card__media" href="{{ U(p.url) }}" tabindex="-1" aria-hidden="true">
    {% if p.thumb %}<img src="{{ U(p.url + p.thumb) }}" alt="" width="{{ p.thumb_wh[0] }}" height="{{ p.thumb_wh[1] }}" loading="lazy" decoding="async">
    {% else %}<span class="card__placeholder"><svg aria-hidden="true"><use href="#sun"/></svg></span>{% endif %}
  </a>
  <div class="card__body">
    <p class="card__date"><time datetime="{{ p.date.isoformat() }}">{{ fmt_short(p.date) }}</time></p>
    <h2 class="card__title"><a href="{{ U(p.url) }}">{{ p.title }}</a></h2>
  </div>
</article>
{% endmacro %}
